name: Docker Publish gdpm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    permissions:
      contents: read
      packages: write
    uses: abrance/yoc/.github/workflows/docker-publish-ghcr.yml@v1.0.1
    with:
      context: tools/gdpm
      file: tools/gdpm/Dockerfile
      image-name: abrance/ems-gdpm
      platforms: linux/amd64
      tags: |
        type=ref,event=tag
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
