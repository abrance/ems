name: Docker Build

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  docker-build:
    uses: abrance/yoc/.github/workflows/docker-build.yml@v1.0.0
    with:
      context: OpenLEMS
      file: OpenLEMS/script/Dockerfile.dev
      image-name: ${{ github.repository }}
      platforms: linux/amd64
      push: false
