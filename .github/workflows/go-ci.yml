name: Go CI

on:
  # 只跑 OpenLEMS/ 下的改动。docs/、deploy/、tools/ 之类的改动不需要编 C++/前端/25 个 Go 模块。
  # web/ 也算在内：go-ci 里有 //go:embed web.zip，前端一改它就必须重编。
  pull_request:
    paths:
      - "OpenLEMS/**"
      - ".github/workflows/go-ci.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "OpenLEMS/**"
      - ".github/workflows/go-ci.yml"

permissions:
  contents: read

# PR 上连推时取消上一次：这个 workflow 要编 hexlib + 前端 + 跑全部工作区模块，
# 不取消的话一次 force-push 就把旧的三套跑完，白烧额度。
# main 上不取消：每个合入 commit 的结论都要留痕。
concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-ci:
    name: Go CI
    runs-on: [self-hosted, linux, x64, ems]
    env:
      CGO_ENABLED: "1"
      CGO_LDFLAGS: "-lm"
    defaults:
      run:
        working-directory: OpenLEMS/application

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: OpenLEMS/go.work

      - name: Build hexlib
        working-directory: OpenLEMS/@cpp/hexlib
        run: make build

      # //go:embed web.zip 要求编译时该文件存在，而 zip 已不再入库（构建镜像时才生成）。
      # 所以这里必须先构建前端，否则 go vet/test/build 直接编译不过。
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: OpenLEMS/web/package.json

      - name: Build frontend (产出 application/manifest/web.zip)
        working-directory: OpenLEMS/web
        run: npm ci && npm run pack

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...

  # 工作区里除 application 以外的模块（services / plugins / common / tools）。
  #
  # 为什么单开一个 job：`defaults.run.working-directory` 是 application，
  # 上面那套 vet/test 只覆盖到它一个模块。其余约 25 个模块因此从来没被 vet 或测试过 ——
  # 一个「电价类型落库恒为平电」的错就那样在 services/s_price 里藏了很久，
  # 而 vet 本来就能直接报出来（string(枚举)）。
  #
  # 这里的模块清单不手写，直接读 go.work：手写一份迟早会和 go.work 不一致，
  # 而不一致的表现是「新模块静默不受保护」——正是这个 job 要防的事。
  workspace-ci:
    name: Workspace CI（其它模块）
    runs-on: [self-hosted, linux, x64, ems]
    env:
      CGO_ENABLED: "1"
      CGO_LDFLAGS: "-lm"
    defaults:
      run:
        working-directory: OpenLEMS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: OpenLEMS/go.work

      - name: Build hexlib
        working-directory: OpenLEMS/@cpp/hexlib
        run: make build

      - name: Vet & test every workspace module
        run: |
          set -euo pipefail
          # 只列不跑的模块要写在这里，并写清理由（否则它就是下一个「静默不受保护」的模块）
          skip_re='^\./application$'   # 上面 go-ci 已经完整跑过

          go work edit -json | jq -r '.Use[].DiskPath' | while read -r m; do
            if [[ "$m" =~ $skip_re ]]; then
              echo "::notice::$m 由 go-ci 覆盖，此处跳过"
              continue
            fi

            # 这里**故意不为「只有 go.mod 的空壳模块」留后路**：
            # 那种模块本来就不该挂在 go.work 里（此前 p_storage、t_time_task 就是），
            # 真出现了就让 `go vet ./...` 以 "matched no packages" 把它顶红，
            # 让「go.work 里每个模块都有 Go 包」成为一条被守着的不变量。
            echo "::group::$m"
            ( cd "$m" && go vet ./... && go test ./... )
            echo "::endgroup::"
          done
