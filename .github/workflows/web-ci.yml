name: Web CI

on:
  # 只跑前端相关改动。纯 Go 改动（application/ services/ ...）不需要跑前端 CI。
  # script/ 算在内：docker-web-stage 构建的是 OpenLEMS/script/Dockerfile.dev。
  pull_request:
    paths:
      - "OpenLEMS/web/**"
      - "OpenLEMS/script/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "OpenLEMS/web/**"
      - "OpenLEMS/script/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

# PR 上连推时取消上一次：这里光 web-ci 一个 job 就要 npm ci + build，
# browser-check 与 docker-web-stage 又各重跑一遍，不取消就是成倍烧额度。
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-ci:
    name: Web CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenLEMS/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: OpenLEMS/web/package.json
          cache: npm
          cache-dependency-path: OpenLEMS/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Shell smoke
        run: npm run smoke

  # 真浏览器检查：图表到底画出来没有。
  #
  # 为什么单开一个 job：冒烟跑在 happy-dom 里，**没有 canvas** —— `echarts.init` 直接抛错，
  # 「图画没画出来」这件事在冒烟里根本不存在。已经因此漏过两次：
  #   ① 图表在数据到达前挂载，只画首帧；
  #   ② 容器被换成新 DOM 节点，实例还挂在旧节点上 → 容器空、整页没 canvas、且不报错。
  # 这个 job 用无头 Firefox 加载 dist（配 API 桩），查每个 .chart 里有没有 canvas。
  browser-check:
    name: 真浏览器图表检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenLEMS/web
    env:
      # CI 里不许跳过：runner 自带 firefox，缺了就是环境坏了，要红
      BROWSER_CHECK_REQUIRED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: OpenLEMS/web/package.json
          cache: npm
          cache-dependency-path: OpenLEMS/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: 浏览器里查 canvas
        run: node scripts/browser-check.mjs

  # 前端产物最终是打进 Docker 镜像的（Go //go:embed），而镜像只在打 tag 时才构建 ——
  # 也就是「Dockerfile 坏了要等发布才知道」。这里只构建 **web 阶段**（几十秒），
  # 覆盖新加的 node 阶段与 alpine/musl 上的 npm ci；整镜像要编 cgo，不适合每次 PR 都跑。
  docker-web-stage:
    name: Docker web 阶段可构建
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 需要 base 提交才能 diff 出本次改了哪些文件
          fetch-depth: 0

      # 这个 job 验的是 Dockerfile 的 node 阶段与 alpine/musl 上的 npm ci，
      # 与业务源码无关——只有 Dockerfile 或前端依赖清单动了才需要重建。
      - name: 判断是否需要构建
        id: gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          if git diff --name-only "${BASE}" HEAD \
            | grep -qE '^(OpenLEMS/script/Dockerfile\.dev|OpenLEMS/web/package(-lock)?\.json)$'; then
            echo "docker=true" >> "${GITHUB_OUTPUT}"
          else
            echo "docker=false" >> "${GITHUB_OUTPUT}"
            echo "Dockerfile 与前端依赖清单都没动，跳过 docker web 阶段构建"
          fi

      - name: Build web stage
        if: steps.gate.outputs.docker == 'true'
        run: |
          docker build \
            --target web \
            -f OpenLEMS/script/Dockerfile.dev \
            -t lems-web-stage:pr \
            OpenLEMS

      # 校验放在**宿主**上做：alpine 里既没有 python3 也没有 unzip，
      # 而宿主（ubuntu runner）有 python3 —— 顺带用另一个独立实现再验一遍我们的 zip 写入
      # （打包脚本是手写的 zip 结构，值得让 python 的 zipfile 也读一遍）。
      - name: 取出产物并校验（在宿主上用 python）
        if: steps.gate.outputs.docker == 'true'
        run: |
          cid=$(docker create lems-web-stage:pr)
          docker cp "$cid:/out/web.zip" /tmp/web.zip
          docker rm "$cid" >/dev/null
          python3 - <<'EOF'
          import zipfile

          z = zipfile.ZipFile('/tmp/web.zip')
          assert z.testzip() is None, 'CRC 校验失败：zip 结构坏了'
          names = z.namelist()
          chunks = [n for n in names if n.endswith('.js') and 'View-' in n]
          print(f'文件 {len(names)} 个，页面 chunk {len(chunks)} 个')
          assert 'index.html' in names, 'zip 里没有 index.html（界面打不开）'
          assert len(chunks) >= 31, f'页面 chunk 只有 {len(chunks)} 个，可能少打了页面'
          EOF
