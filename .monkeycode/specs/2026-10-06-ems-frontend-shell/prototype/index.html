<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EMS 前端原型 · 场景 / 管理 / 配置</title>
<style>
/* ============================================================
   Design tokens
   - 间距阶梯：4 / 8 / 12 / 16 / 24 / 32（只允许取这些值）
   - 字号阶梯：12 / 13 / 14 / 16 / 18 / 22
   - 圆角阶梯：2 / 6 / 10 / pill
   - 品牌橙 #ff7d00 只用于填充·竖条·图表；
     承载文字时改用 --brand-ink；按钮底改为 --brand-btn（白字达标）
   ============================================================ */
:root{
  --bg-1:#f7f8fa; --bg-2:#fff; --bg-3:#f2f3f5; --bg-4:#fafbfc;
  --border:#e8eaee; --divider:#f0f1f4;

  --text-1:#1d2129; --text-2:#4e5969; --text-3:#626c78;

  --brand:#ff7d00;        /* 填充 / 竖条 / 图表 */
  --brand-ink:#b85000;    /* 浅底上的品牌文字 */
  --brand-btn:#c25400;    /* 白字按钮底 */
  --brand-btn-h:#b85000;
  --brand-soft:#fff7e8;
  --brand-line:#ffd9a8;

  --green:#00b42a; --green-ink:#046a24; --green-soft:#e8ffea;
  --red:#f53f3f;   --red-ink:#a8071a;   --red-soft:#ffece8;
  --blue:#165dff;  --blue-ink:#0e42d2;  --blue-soft:#e8f3ff;
  --purple:#722ed1;--purple-ink:#4b1f91;--purple-soft:#f5e8ff;
  --gold:#f7ba1e;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r-xs:2px; --r-sm:6px; --r-md:10px; --r-pill:999px;

  --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px; --fs-18:18px; --fs-22:22px;

  --h-appbar:56px; --h-tabs:44px; --h-pagehead:56px; --w-side:220px;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg-1); color:var(--text-1); font-size:var(--fs-14); line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-ink);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d5d8dd;border-radius:var(--r-pill)}

/* ============ ① AppBar ============ */
.appbar{
  flex:0 0 var(--h-appbar); height:var(--h-appbar);
  background:var(--bg-2); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:var(--s4); padding:0 var(--s4); z-index:30;
}
.brand{display:flex;align-items:center;gap:var(--s2);font-weight:700;font-size:var(--fs-16)}
.brand .mark{
  width:28px;height:28px;border-radius:var(--r-sm);background:var(--brand-btn);color:#fff;
  display:grid;place-items:center;font-size:var(--fs-12);font-weight:800
}
.site-switch{
  display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s3);
  border-radius:var(--r-sm);background:var(--bg-3);color:var(--text-2);font-size:var(--fs-13)
}
.site-switch:hover{background:#e9eaee}
.appbar .spacer{flex:1}
.icon-btn{
  width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--text-2);background:var(--bg-3)
}
.icon-btn:hover{background:#e9eaee}
.user-menu{
  display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s3) var(--s1) var(--s1);
  border-radius:var(--r-pill);background:var(--bg-3);font-size:var(--fs-13)
}
.user-menu:hover{background:#e9eaee}
.avatar{width:24px;height:24px;border-radius:var(--r-pill);background:var(--brand-soft);
  color:var(--brand-ink);display:grid;place-items:center;font-size:var(--fs-12);font-weight:700}

/* ============ ② Tabs ============ */
.tabs{
  flex:0 0 var(--h-tabs); height:var(--h-tabs);
  background:var(--bg-2); border-bottom:1px solid var(--border);
  display:flex; align-items:stretch; gap:var(--s1); padding:0 var(--s3); z-index:20;
  overflow-x:auto; white-space:nowrap;
}
.tab{position:relative;padding:0 var(--s5);display:flex;align-items:center;font-size:var(--fs-14);color:var(--text-2)}
.tab:hover{color:var(--text-1)}
.tab.active{color:var(--brand-ink);font-weight:600}
.tab.active::after{
  content:"";position:absolute;left:var(--s5);right:var(--s5);bottom:0;height:2px;
  background:var(--brand);border-radius:var(--r-xs)
}

/* ============ ③/④/⑤ 主体 ============ */
.body{flex:1;display:flex;min-height:0}
.sidebar{
  flex:0 0 var(--w-side);width:var(--w-side);background:var(--bg-2);
  border-right:1px solid var(--border);overflow-y:auto;padding:var(--s3) var(--s2) var(--s5);
  transition:width .15s
}
.sidebar.collapsed{flex-basis:56px;width:56px}
.side-group{font-size:var(--fs-12);letter-spacing:.12em;color:var(--text-3);padding:var(--s4) var(--s3) var(--s2)}
.side-item{
  display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);border-radius:var(--r-sm);
  color:var(--text-2);font-size:var(--fs-13);cursor:pointer;white-space:nowrap
}
.side-item:hover{background:var(--bg-3)}
.side-item.active{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.side-item .dot{width:6px;height:6px;border-radius:var(--r-pill);background:currentColor;opacity:.45;flex:0 0 auto}
.side-item .badge{margin-left:auto;font-size:var(--fs-12);background:var(--bg-3);color:var(--text-3);border-radius:var(--r-pill);padding:1px var(--s2)}
.side-item.active .badge{background:var(--brand-ink);color:#fff}
.side-item .badge.todo{background:var(--bg-3);color:var(--text-3);margin-left:var(--s1)}
.side-item.is-todo{color:var(--text-3)}
.side-item.is-todo.active{color:var(--brand-ink)}
.sidebar.collapsed .side-label,.sidebar.collapsed .side-group,.sidebar.collapsed .badge{display:none}
.sidebar.collapsed .side-item{justify-content:center;padding:var(--s2) 0}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.pagehead{
  flex:0 0 var(--h-pagehead);height:var(--h-pagehead);background:var(--bg-2);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--s3);
  padding:0 var(--s4);position:sticky;top:0;z-index:10
}
.pagehead .crumbs{font-size:var(--fs-12);color:var(--text-3)}
.pagehead h1{margin:0;font-size:var(--fs-18);font-weight:600;letter-spacing:-.01em}
.pagehead .spacer{flex:1}
.content{flex:1;overflow-y:auto;padding:var(--s4)}

/* ============ 控件 ============ */
.radio-group{display:inline-flex;background:var(--bg-3);border-radius:var(--r-sm);padding:var(--r-xs)}
.radio-group button{padding:var(--s1) var(--s3);border-radius:var(--r-xs);font-size:var(--fs-13);color:var(--text-2)}
.radio-group button.on{background:var(--bg-2);color:var(--brand-ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{display:inline-flex;align-items:center;gap:var(--s2);font-size:var(--fs-13);color:var(--text-3)}
.field input,.field select{
  border:1px solid var(--border);border-radius:var(--r-sm);padding:var(--s1) var(--s3);
  background:var(--bg-2);color:var(--text-1)
}
.btn{border-radius:var(--r-sm);padding:var(--s2) var(--s4);font-size:var(--fs-13);background:var(--bg-3);color:var(--text-2)}
.btn:hover{background:#e9eaee}
.btn.primary{background:var(--brand-btn);color:#fff}
.btn.primary:hover{background:var(--brand-btn-h)}
.btn.danger{background:var(--red-soft);color:var(--red-ink)}
.btn.ghost{border:1px solid var(--border);background:transparent}
.btn.sm{padding:var(--s1) var(--s3);font-size:var(--fs-12)}
.chip{display:inline-block;font-size:var(--fs-12);border-radius:var(--r-pill);padding:1px var(--s2);line-height:18px}
.chip.gray{background:var(--bg-3);color:var(--text-2)}
.chip.green{background:var(--green-soft);color:var(--green-ink)}
.chip.orange{background:var(--brand-soft);color:var(--brand-ink)}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.chip.blue{background:var(--blue-soft);color:var(--blue-ink)}
.chip.purple{background:var(--purple-soft);color:var(--purple-ink)}
/* 开关型 chip：替代用「主按钮」冒充勾选框 */
.chip-toggle{
  display:inline-flex;align-items:center;gap:var(--s1);font-size:var(--fs-12);
  padding:var(--s1) var(--s3);border-radius:var(--r-sm);
  background:var(--bg-3);color:var(--text-2)
}
.chip-toggle:hover{background:#e9eaee}
.chip-toggle.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}

/* ============ 面板 ============ */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--s4)}
.panel{
  grid-column:span var(--span,12);
  background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-md);
  display:flex;flex-direction:column;overflow:hidden;min-width:0
}
.panel-head{
  display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);min-height:48px;
  border-bottom:1px solid var(--divider)
}
.panel-head::before{content:"";width:3px;height:16px;border-radius:var(--r-xs);background:var(--brand);flex:0 0 auto}
.panel-title{font-size:var(--fs-16);font-weight:600;letter-spacing:-.01em}
.panel-sub{font-size:var(--fs-12);color:var(--text-3)}
.panel-head .spacer{flex:1}
.panel-body{padding:var(--s4);flex:1;min-width:0}
.panel-body.tight{padding:0}
.panel-foot{
  padding:var(--s2) var(--s4);border-top:1px solid var(--divider);
  font-size:var(--fs-12);color:var(--text-3);display:flex;gap:var(--s3);flex-wrap:wrap
}
.panel.empty .panel-body{display:grid;place-items:center;color:var(--text-3);min-height:140px;font-size:var(--fs-13)}

/* ============ KPI ============ */
.kpis{display:grid;gap:var(--s4);grid-template-columns:repeat(6,1fr)}
.kpis.c4{grid-template-columns:repeat(4,1fr)}
.kpis.c3{grid-template-columns:repeat(3,1fr)}
.kpi{
  background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-md);
  padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s1);min-width:0
}
.kpi .k{font-size:var(--fs-12);color:var(--text-3);display:flex;align-items:center;gap:var(--s2)}
.kpi .v{font-size:var(--fs-22);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .v small{font-size:var(--fs-12);font-weight:500;color:var(--text-3);margin-left:var(--s1)}
.kpi .d{font-size:var(--fs-12);color:var(--text-3)}
.kpi .v.up{color:var(--red-ink)} .kpi .v.down{color:var(--green-ink)}

/* ============ 图表 ============ */
.chart{width:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s4);margin-top:var(--s3);font-size:var(--fs-12);color:var(--text-2)}
.legend .lg{display:flex;align-items:center;gap:var(--s2)}
.legend .sw{width:12px;height:3px;border-radius:var(--r-xs)}
.legend .sw.dash{height:0;border-top:2px dashed currentColor}
.axis{font-size:9px;fill:var(--text-3)}

/* ============ 表格 ============ */
table{width:100%;border-collapse:collapse;font-size:var(--fs-13)}
th{
  text-align:left;font-weight:500;color:var(--text-3);font-size:var(--fs-12);
  padding:var(--s2) var(--s3);border-bottom:1px solid var(--border);background:var(--bg-2);
  position:sticky;top:0;z-index:1
}
td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--divider);font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg-4)}
td.num,th.num{text-align:right}
.scroll-y{max-height:320px;overflow:auto}

/* ============ 其他组件 ============ */
.rows{display:flex;flex-direction:column;gap:var(--s3)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s4) var(--s5)}
.form-item{display:flex;flex-direction:column;gap:var(--s2)}
.form-item label{font-size:var(--fs-12);color:var(--text-3)}
.form-item input,.form-item select,.form-item textarea{
  border:1px solid var(--border);border-radius:var(--r-sm);padding:var(--s2) var(--s3);
  background:var(--bg-2);width:100%
}
.form-item input:focus-visible,.form-item select:focus-visible,.field input:focus-visible{
  outline:2px solid var(--brand-line);outline-offset:1px;border-color:var(--brand-line)
}
.form-item .hint{font-size:var(--fs-12);color:var(--text-3)}
.seg-bar{display:flex;border-radius:var(--r-sm);overflow:hidden;height:48px}
.seg{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:var(--fs-12);gap:2px}
.seg b{font-size:var(--fs-13)}
.rule-list{display:flex;flex-direction:column;gap:var(--s3)}
/* 卡片用「浅底」而不是再叠一层边框 */
.rule{
  border-radius:var(--r-md);padding:var(--s3) var(--s4);display:flex;align-items:center;gap:var(--s3);
  background:var(--bg-4)
}
.rule .rname{font-weight:600;font-size:var(--fs-13)}
.rule .rsub{font-size:var(--fs-12);color:var(--text-3)}
.rule .spacer{flex:1}
.switch{width:40px;height:22px;border-radius:var(--r-pill);background:#c9cdd4;position:relative;transition:.15s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:var(--r-pill);background:#fff;transition:.15s}
.switch.on{background:var(--brand-btn)}
.switch.on::after{left:20px}
.tabs-inline{display:flex;gap:var(--s5);border-bottom:1px solid var(--border);margin:calc(-1 * var(--s4)) calc(-1 * var(--s4)) var(--s4);padding:0 var(--s4)}
.tabs-inline button{padding:var(--s3) 0;font-size:var(--fs-13);color:var(--text-2);position:relative}
.tabs-inline button.on{color:var(--brand-ink);font-weight:600}
.tabs-inline button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand)}
.tree{font-size:var(--fs-13)}
.tree .node{padding:var(--s2) var(--s3);border-radius:var(--r-sm);cursor:pointer;display:flex;align-items:center;gap:var(--s2)}
.tree .node:hover{background:var(--bg-3)}
.tree .node.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.tree .child{padding-left:var(--s4)}
.matrix{
  display:grid;grid-template-columns:120px repeat(4,1fr);gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;font-size:var(--fs-13)
}
.matrix div{background:var(--bg-2);padding:var(--s2) var(--s3)}
.matrix .h{color:var(--text-3);font-size:var(--fs-12);background:var(--bg-3)}
.heat{display:grid;gap:2px}
.heat i{display:block;border-radius:var(--r-xs);background:var(--brand-line)}
/* 提示条：左色条 + 浅底，不再叠边框 */
.notice{
  display:flex;gap:var(--s3);align-items:flex-start;background:var(--brand-soft);
  border-left:3px solid var(--brand);border-radius:var(--r-sm);
  padding:var(--s3) var(--s4);font-size:var(--fs-13);color:var(--brand-ink)
}
.two-col{display:grid;grid-template-columns:minmax(260px,34%) 1fr;gap:var(--s4);min-height:0}
.h300{height:300px;overflow:auto}
.muted{color:var(--text-3)}
.mono{font-variant-numeric:tabular-nums}
.link{color:var(--brand-ink);cursor:pointer}

/* ============ 响应式 ============ */
@media (max-width:1280px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpis.c4{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:repeat(6,1fr)}
  .panel{grid-column:span 6}
  .two-col{grid-template-columns:1fr}
}
@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  .panel{grid-column:span 1}
  .form-grid{grid-template-columns:1fr}
  .sidebar{display:none}
}
</style>
</head>
<body>
<div class="appbar">
  <div class="brand"><span class="mark">EMS</span>能源管理系统</div>
  <button class="site-switch" data-act="noop">站点：储能柜示范站 ▾</button>
  <div class="spacer"></div>
  <button class="icon-btn" data-act="collapse" title="收起侧栏">☰</button>
  <button class="user-menu" data-act="noop"><span class="avatar">管</span>admin ▾</button>
</div>
<div class="tabs" id="tabs"></div>
<div class="body">
  <aside class="sidebar" id="sidebar"></aside>
  <section class="main">
    <header class="pagehead" id="pagehead"></header>
    <div class="content" id="content"></div>
  </section>
</div>
<script>
/* =========================================================================
   原型说明
   - 单文件、无依赖、离线可开（file:// 直接打开）
   - 数据全为 mock，仅演示信息架构与交互；数值不作业务依据
   - 对应设计稿：.monkeycode/specs/2026-10-06-ems-frontend-shell/design.md
   ========================================================================= */

/* ---------------- mock 数据 ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20261006);
function series(n,base,amp,{phase=0,clamp=null,dip=null}={}){
  const out=[];
  for(let i=0;i<n;i++){
    const t=i/n;
    const day=Math.sin((t*2-0.5)*Math.PI);            // 白天高
    const v=base+amp*day*0.6+amp*(R()-0.5)*0.5+amp*0.25*Math.sin(t*8+phase);
    let x=Math.round(v*10)/10;
    if(dip&&i>dip[0]&&i<dip[1]) x=Math.round(x*0.55*10)/10;
    if(clamp) x=Math.max(clamp[0],Math.min(clamp[1],x));
    out.push(x);
  }
  return out;
}
const N96=96;
const DATA={
  boundary:{
    newEnergy:series(N96,420,180,{phase:1,clamp:[80,900]}),
    totalLoad:series(N96,3100,400,{phase:0,clamp:[2200,3900]}),
  },
  ratio:series(N96,1.32,0.18,{clamp:[1.0,1.7]}),
  forecast:{
    ahead:series(N96,380,90,{phase:.4,clamp:[60,760]}),
    real:series(N96,365,100,{phase:.6,clamp:[40,820]}),
    aheadPred:series(N96,372,88,{phase:.5,clamp:[60,720]}),
    realPred:series(N96,358,96,{phase:.7,clamp:[40,780]}),
  },
  freq:{capPrice:series(N96,9.5,3.2,{clamp:[2,18]}),milePrice:series(N96,5.4,1.8,{clamp:[1,11]})},
  similar:[
    {date:"2026-09-14",sim:0.93},{date:"2026-09-07",sim:0.89},{date:"2026-08-31",sim:0.86},
    {date:"2026-09-19",sim:0.82},{date:"2026-08-24",sim:0.78},{date:"2026-09-02",sim:0.74},
    {date:"2026-08-17",sim:0.71},{date:"2026-09-11",sim:0.68},
  ],
  dispatch:series(N96,45,60,{clamp:[-50,50]}),      // 正=充电
  energy:Array.from({length:N96},(_,i)=>Math.round((i+1)*1.8*10)/10),
  output:series(N96,62,20,{clamp:[0,100]}),
};
DATA.boundary.netLoad=DATA.boundary.totalLoad.map((v,i)=>Math.round((v-DATA.boundary.newEnergy[i])*10)/10);
DATA.stack=[
  {name:"火电最小出力",color:"#86909c",data:Array(N96).fill(680)},
  {name:"固定出力",color:"#4e5969",data:Array(N96).fill(520)},
  {name:"风电出力",color:"#0fc6c2",data:series(N96,260,90,{phase:2,clamp:[60,460]})},
  {name:"光伏出力",color:"#f7ba1e",data:series(N96,300,220,{phase:1.2,clamp:[0,600]})},
  {name:"500MW+火电可调",color:"#ff7d00",data:series(N96,420,80,{phase:.3})},
  {name:"300-500MW",color:"#ffa940",data:series(N96,300,60,{phase:.8})},
  {name:"200-300MW",color:"#ffd591",data:series(N96,200,40,{phase:1.1})},
  {name:"<200MW",color:"#ffe7ba",data:series(N96,120,30,{phase:1.5})},
  {name:"燃气可调",color:"#722ed1",data:series(N96,90,30,{phase:1.9})},
];
const COLORS={orange:"#ff7d00",blue:"#165dff",green:"#00b42a",red:"#f53f3f",cyan:"#0fc6c2",gray:"#86909c",purple:"#722ed1",gold:"#f7ba1e",dark:"#4e5969"};

/* ---------------- 通用工具 ---------------- */
const h=(s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=(v,d=1)=>v==null||isNaN(v)?"—":Number(v).toFixed(d);
const pct=(v,d=1)=>`${f(v*100,d)}%`;

/* ---------------- SVG 图表 ---------------- */
function niceLabel(i,n){const hh=String(Math.floor(i/4)).padStart(2,"0");const mm=(i%4)*15;return `${hh}:${String(mm).padStart(2,"0")}`}
function axisTicks(n,count=7){const out=[];for(let i=0;i<count;i++)out.push(Math.round(i*(n-1)/(count-1)));return out}
function svgLine({series:ser,yMin,yMax,hgt=240,unit="",area=false,zero=false}){
  const W=740,H=hgt,padL=46,padR=12,padT=12,padB=24;
  const n=ser[0].data.length;
  const lo=zero?Math.min(0,yMin??Math.min(...ser.flatMap(s=>s.data.filter(v=>v!=null)))):(yMin??Math.min(...ser.flatMap(s=>s.data.filter(v=>v!=null))));
  const hi=yMax??Math.max(...ser.flatMap(s=>s.data.filter(v=>v!=null)));
  const y0=lo-(hi-lo)*0.08, y1=hi+(hi-lo)*0.08;
  const X=i=>padL+(W-padL-padR)*(i/(n-1));
  const Y=v=>padT+(H-padT-padB)*(1-(v-y0)/(y1-y0));
  let g="";
  for(let k=0;k<=4;k++){
    const v=y0+(y1-y0)*k/4, y=Y(v);
    g+=`<line x1="${padL}" x2="${W-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#eef0f3"/>`;
    g+=`<text class="axis" x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${f(v,0)}</text>`;
  }
  axisTicks(n).forEach(i=>{
    g+=`<text class="axis" x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${niceLabel(i,n)}</text>`;
  });
  let paths="";
  ser.forEach(s=>{
    const pts=s.data.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    if(area){
      paths+=`<polygon points="${padL},${Y(y0)} ${pts} ${X(n-1)},${Y(y0)}" fill="${s.color}" opacity=".14"/>`;
    }
    paths+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2"`
         + (s.dash?` stroke-dasharray="6 4"`:"")
         + (s.mute?` opacity=".45"`:"") + `/>`;
  });
  const band = ser.band ? (()=>{const lo2=ser.band.lo.data,hi2=ser.band.hi.data;
    const top=hi2.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    const bot=lo2.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).reverse().join(" ");
    return `<polygon points="${top} ${bot}" fill="${ser.band.color}" opacity=".12"/>`})() : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${g}${band}${paths}
    ${unit?`<text class="axis" x="${padL}" y="${padT+8}">${unit}</text>`:""}
  </svg>`;
}
function svgStack({layers,hgt=260,unit=""}){
  const W=740,H=hgt,padL=46,padR=12,padT=12,padB=24;
  const n=layers[0].data.length;
  const cum=layers[0].data.map(()=>0);
  const totals=layers[0].data.map((_,i)=>layers.reduce((a,l)=>a+l.data[i],0));
  const hi=Math.max(...totals)*1.06;
  const X=i=>padL+(W-padL-padR)*(i/(n-1));
  const Y=v=>padT+(H-padT-padB)*(1-v/hi);
  let g="";
  for(let k=0;k<=4;k++){const v=hi*k/4,y=Y(v);
    g+=`<line x1="${padL}" x2="${W-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#eef0f3"/>`;
    g+=`<text class="axis" x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${f(v,0)}</text>`;}
  axisTicks(n).forEach(i=>g+=`<text class="axis" x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${niceLabel(i,n)}</text>`);
  let areas="";
  layers.forEach(l=>{
    const lo=[],up=[];
    l.data.forEach((v,i)=>{const a=cum[i],b=cum[i]+v;lo.push(`${X(i).toFixed(1)},${Y(a).toFixed(1)}`);up.push(`${X(i).toFixed(1)},${Y(b).toFixed(1)}`);cum[i]=b});
    areas+=`<polygon points="${up.join(" ")} ${lo.reverse().join(" ")}" fill="${l.color}" opacity=".82"/>`;
  });
  areas+=`<polyline points="${totals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="${COLORS.dark}" stroke-width="2" stroke-dasharray="6 4"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${g}${areas}${unit?`<text class="axis" x="${padL}" y="${padT+8}">${unit}</text>`:""}</svg>`;
}
function svgBars({groups,labels,yMax,hgt=220,unit="",stacked=false}){
  const W=740,H=hgt,padL=46,padR=12,padT=12,padB=26;
  const n=labels.length;
  const slot=(W-padL-padR)/n;
  const hi=yMax??Math.max(...groups.flatMap(g=>stacked?g.data.map((v,i)=>v):g.data))*1.1;
  const Y=v=>padT+(H-padT-padB)*(1-v/hi);
  let g="";
  for(let k=0;k<=4;k++){const v=hi*k/4,y=Y(v);
    g+=`<line x1="${padL}" x2="${W-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#eef0f3"/>`;
    g+=`<text class="axis" x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${f(v,0)}</text>`}
  let bars="";
  labels.forEach((lab,i)=>{
    const cx=padL+slot*(i+0.5);
    if(stacked){
      let acc=0;
      groups.forEach((gr,gi)=>{
        const v=gr.data[i],x=cx-slot*0.3, w=slot*0.6;
        const y=Y(acc+v), hh=Y(acc)-Y(acc+v);
        bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,hh).toFixed(1)}" fill="${gr.color}" opacity=".85"/>`;
        void gi; acc+=v;
      });
    }else{
      const bw=(slot*0.72)/groups.length;
      groups.forEach((gr,gi)=>{
        const v=gr.data[i],x=cx-slot*0.36+gi*bw;
        bars+=`<rect x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${(Y(0)-Y(v)).toFixed(1)}" rx="2" fill="${gr.color}" opacity=".85"/>`;
      });
    }
    if(i%Math.ceil(n/14)===0) bars+=`<text class="axis" x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle">${lab}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}${bars}${unit?`<text class="axis" x="${padL}" y="${padT+8}">${unit}</text>`:""}</svg>`;
}
function svgDonut({items,size=170,center="",sub=""}){
  const total=items.reduce((a,b)=>a+b.value,0)||1;
  const r=size/2, ir=r*0.62, cx=r, cy=r;
  let a0=-Math.PI/2, paths="";
  items.forEach(it=>{
    const a1=a0+(it.value/total)*Math.PI*2;
    const large=a1-a0>Math.PI?1:0;
    const p=(ang,rad)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];
    const [x0,y0]=p(a0,r),[x1,y1]=p(a1,r),[x2,y2]=p(a1,ir),[x3,y3]=p(a0,ir);
    paths+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)} A${ir} ${ir} 0 ${large} 0 ${x3.toFixed(1)} ${y3.toFixed(1)} Z" fill="${it.color}" opacity=".9"/>`;
    a0=a1;
  });
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" style="max-width:${size}px;margin:0 auto">
    ${paths}
    <text x="${cx}" y="${cy-2}" text-anchor="middle" style="font-size:var(--fs-22);font-weight:700;fill:var(--text-1)">${h(center)}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" style="font-size:var(--fs-12);fill:var(--text-3)">${h(sub)}</text>
  </svg>`;
}
function legend(items){
  return `<div class="legend">${items.map(i=>`<span class="lg" style="color:${i.color}">
    <span class="sw ${i.dash?"dash":""}"></span><span style="color:var(--text-2)">${h(i.name)}</span></span>`).join("")}</div>`;
}
function heatGrid({rows,cols,fn,cell=13}){
  let s=`<div class="heat" style="grid-template-columns:repeat(${cols},${cell}px)">`;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const o=fn(r,c);s+=`<i title="${h(o.t)}" style="height:${cell}px;background:${o.c}"></i>`}
  return s+`</div>`;
}

/* ---------------- 面板 ---------------- */
function panel(o){
  return `<section class="panel ${o.empty?"empty":""}" style="--span:${o.span||12}">
    <div class="panel-head">
      <span class="panel-title">${h(o.title)}</span>
      ${o.sub?`<span class="panel-sub">${h(o.sub)}</span>`:""}
      <span class="spacer"></span>
      ${o.actions||""}
    </div>
    <div class="panel-body ${o.tight?"tight":""}">${o.body||`<span class="muted">暂无数据</span>`}</div>
    ${o.foot===false?"":`<div class="panel-foot">${o.foot||"数据来源：mock · 更新于 18:58"}</div>`}
  </section>`;
}
function kpi(o){
  return `<div class="kpi"><div class="k">${h(o.k)}${o.tag||""}</div>
    <div class="v ${o.dir||""}">${o.v}${o.unit?`<small>${h(o.unit)}</small>`:""}</div>
    <div class="d">${o.d||""}</div></div>`;
}
function kpis(list,cols){return `<div class="kpis ${cols?"c"+cols:""}">${list.join("")}</div>`}
function table({cols,rows,cls=""}){
  return `<div class="scroll-y"><table class="${cls}"><thead><tr>${cols.map(c=>`<th class="${c.num?"num":""}">${h(c.title??c)}</th>`).join("")}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${cols[i]&&cols[i].num?"num":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function radio(name,opts,value){
  return `<span class="radio-group" data-radio="${name}">${opts.map(o=>
    `<button class="${value===o.v?"on":""}" data-act="radio" data-name="${name}" data-value="${o.v}">${h(o.t)}</button>`).join("")}</span>`;
}
function sw(on){return `<span class="switch ${on?"on":""}" data-act="switch"></span>`}

const app={tabs:document.getElementById("tabs"),side:document.getElementById("sidebar"),
  head:document.getElementById("pagehead"),content:document.getElementById("content")};

function renderTabs(){
  app.tabs.innerHTML=Object.entries(NAV).map(([k,v])=>
    `<button class="tab ${ST.tab===k?"active":""}" data-act="tab" data-value="${k}">${h(v.title)}</button>`).join("");
}
function renderSide(){
  const group=NAV[ST.tab];
  app.side.className="sidebar"+(ST.collapsed?" collapsed":"");
  app.side.innerHTML=`<div class="side-group">${h(group.title)}</div>`+group.pages.map(p=>
    `<div class="side-item ${ST.page===p.k?"active":""} ${p.todo?"is-todo":""}" data-act="page" data-value="${p.k}" title="${h(p.t)}${p.todo?" · 本期不做":""}">
      <span class="dot"></span><span class="side-label">${h(p.t)}</span>
      ${p.badge?`<span class="badge">${p.badge}</span>`:""}
      ${p.todo?`<span class="badge todo">TODO</span>`:""}</div>`).join("");
}
function renderHead(){
  const group=NAV[ST.tab],page=group.pages.find(p=>p.k===ST.page)||group.pages[0];
  let actions="";
  if(ST.tab==="scene"){
    actions=`<label class="field">场景
        <select data-act="scene"><option>广东现货日报</option><option>山西现货交易</option><option>储能套利</option></select></label>`
      +sceneHead()
      + (ST.page==="forecast"?P.forecastHeadExtra():"")
      +`<button class="btn ghost">导出</button>`;
  }
  app.head.innerHTML=`<div><div class="crumbs">${h(group.title)} / ${h(page.t)}</div><h1>${h(page.t)}</h1></div>
    <span class="spacer"></span>${actions}`;
}
function renderContent(){
  const page=NAV[ST.tab].pages.find(p=>p.k===ST.page);
  const fn=P[ST.page]||(()=>`<div class="grid">${panel({span:12,title:page.t,empty:true,
    body:"<span class='muted'>原型占位：结构同设计稿，内容待补</span>"})}</div>`);
  const banner=page&&page.todo
    ? `<div class="notice" style="margin-bottom:var(--s4)"><b>本期不做</b>　设计已留，后续版本再实现（不影响充放电主线条）。</div>`
    : "";
  app.content.innerHTML=banner+fn();
  app.content.scrollTop=0;
}
function render(){renderTabs();renderSide();renderHead();renderContent()}

/* ---------------- 事件 ---------------- */
document.body.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;
  if(act==="tab"){ST.tab=el.dataset.value;ST.page=NAV[ST.tab].pages[0].k;render()}
  else if(act==="page"){ST.page=el.dataset.value;render()}
  else if(act==="collapse"){ST.collapsed=!ST.collapsed;renderSide()}
  else if(act==="radio"){ST[el.dataset.name]=el.dataset.value;render()}
  else if(act==="switch"){el.classList.toggle("on")}
  else if(act==="itab"){ST.inlineTab[el.dataset.name]=el.dataset.value;renderContent()}
  else if(act==="hist"){ST.histOn[el.dataset.value]=!ST.histOn[el.dataset.value];renderContent()}
  else if(act==="noop"){/* 原型占位 */}
});
document.body.addEventListener("change",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.dataset.act==="date"){ST.date=el.value;renderContent()}
  if(el.dataset.act==="scene"){ST.scene=el.value;renderContent()}
  if(el.dataset.act==="gran"){ST.histGran=el.value}
});

render();
</script>
</body>
